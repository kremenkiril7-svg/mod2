name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unzip source
        run: for z in *.zip; do unzip -o -q "$z"; done
      - name: Build
        run: cd visuals && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: visuals-mod
          path: visuals/build/libs/*.jar
